# The stack's entrypoint and only published port (compose.yml). Routes by host:
# auth.* goes to Keycloak, everything else to the app. Keycloak gets its own
# origin rather than a path on the app's, so the PWA's service worker never
# answers for its login pages.

# Docker's DNS. Upstreams are looked up per request (proxy_pass with a
# variable), so a recreated container's new address is picked up.
resolver 127.0.0.11 valid=10s;

# The app builds absolute URLs (login callbacks) from the Host it receives.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
# Keycloak's responses carry large cookie headers.
proxy_buffer_size 16k;
proxy_buffers 8 16k;

server {
  listen 80 default_server;
  set $app http://app:3000;
  location / {
    proxy_pass $app;
  }
}

server {
  listen 80;
  server_name ~^auth\.;
  set $keycloak http://keycloak:8080;
  # Only what browsers need (realm login pages, OIDC endpoints, assets), as
  # Keycloak's reverse-proxy guide recommends; the admin console stays private.
  location /realms/ {
    proxy_pass $keycloak;
  }
  location /resources/ {
    proxy_pass $keycloak;
  }
  location / {
    return 404;
  }
}
